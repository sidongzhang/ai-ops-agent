services:
  platform-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: opspass
      POSTGRES_DB: controlplane
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d controlplane"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 避免与其他 Redis 实例冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  platform-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ops:opspass@platform-db:5432/controlplane
      CELERY_BROKER_URL: redis://platform-redis:6379/0
      CELERY_RESULT_BACKEND: redis://platform-redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before production deployment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY before production deployment}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      platform-db:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ops:opspass@platform-db:5432/controlplane
      CELERY_BROKER_URL: redis://platform-redis:6379/0
      CELERY_RESULT_BACKEND: redis://platform-redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before production deployment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY before production deployment}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    command: celery -A app.workers.celery.celery worker --loglevel=INFO
    depends_on:
      platform-api:
        condition: service_healthy

  platform-beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ops:opspass@platform-db:5432/controlplane
      CELERY_BROKER_URL: redis://platform-redis:6379/0
      CELERY_RESULT_BACKEND: redis://platform-redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before production deployment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY before production deployment}
    command: celery -A app.workers.celery.celery beat --loglevel=INFO
    depends_on:
      platform-api:
        condition: service_healthy

  platform-web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      platform-api:
        condition: service_healthy

volumes:
  platform_pg_data:
