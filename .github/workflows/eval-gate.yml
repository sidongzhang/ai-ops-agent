name: eval-gate

# 评测门禁（冒烟）：不依赖 Docker / LLM，验证「数据集 → 消融 → 工具轨迹 → 打分 → 报告 → 门禁」整条链路，
# 并在指标低于阈值时失败，避免改动提示词/工具/评测脚手架后无声回归。
# 真实质量门禁（需 Docker + LLM）建议单独跑：bash scripts/eval-gate.sh --full

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支快速连续推送时，取消上一轮未完成的运行，避免刷屏与浪费额度
concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖用 uv + 仓库里已提交的 backend/uv.lock 安装（可复现），
      # 不再依赖并不存在的 backend/requirements.txt。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (backend/.venv, incl. dev)
        run: uv sync --directory backend --frozen

      - name: Run eval gate (smoke)
        run: bash scripts/eval-gate.sh

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
          retention-days: 7
