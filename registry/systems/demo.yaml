id: demo
name: "传感器数据管道 Demo"
# local=true 表示这套系统就跑在平台所在主机上（平台托管），可用本机进程/Docker 工具与写动作
local: true
notify:
  type: feishu
  chat_id: oc_0389c0229fd77605bc3a59e36eba7958

services:
  # ── Python 业务进程（本机，pid 文件探活，可重启）──
  - name: producer
    connector: local
    kind: process
    log_file: logs/producer.log
    pid_file: pids/producer.pid
    restart_cmd: ["python3", "business/producer.py"]
  - name: consumer
    connector: local
    kind: process
    log_file: logs/consumer.log
    pid_file: pids/consumer.pid
    restart_cmd: ["python3", "business/consumer.py"]
  - name: frontend
    connector: local
    kind: process
    log_file: logs/frontend.log
    pid_file: pids/frontend.pid
    restart_cmd: ["python3", "business/frontend/app.py"]
    health_url: http://localhost:5001

  # ── Docker 基础设施（docker compose 探活/日志/重启）──
  - name: kafka
    connector: local
    kind: docker
    container: kafka
  - name: mysql
    connector: local
    kind: docker
    container: mysql
  - name: redis
    connector: local
    kind: docker
    container: redis
  - name: prometheus
    connector: local
    kind: docker
    container: prometheus

# 该系统的数据/指标后端连接信息（原 tools.py 模块级全局变量搬到这里）
infra:
  mysql:
    host: localhost
    port: 3306
    user: opsuser
    password: opspass
    database: opsdb
  prometheus:
    url: http://localhost:9090
  kafka:
    container_hint: kafka
    bootstrap: localhost:9092
  redis:
    container: ai-ops-agent-redis-1
