id: example_remote
name: "示例远程系统（agentless 黑盒探测）"
# local=false：平台只做远程只读探测，不在对方机器装东西，也不开放写动作（重启）
local: false
notify:
  type: feishu
  chat_id: ""          # 填该客户的飞书群/单聊 chat_id；该系统的告警会发到这里

services:
  # 对外 HTTP 网站/接口：黑盒探测可用性 + 延迟
  - name: website
    connector: http
    health_url: https://example.com

  # 端口连通性探测（TCP）
  - name: https-port
    connector: tcp
    host: example.com
    port: 443

  # 拉对方 Prometheus 的 up 指标做探活（填了 url 才生效）
  - name: app-metrics
    connector: prometheus
    up_query: up
    url: ""

  # 裸机/VM 进程：通过 SSH 探活 + 读日志（示例，需填真实连接信息后启用）
  # - name: api-server
  #   connector: ssh
  #   host: 1.2.3.4
  #   user: ops
  #   port: 22
  #   identity_file: ~/.ssh/id_rsa
  #   systemd_unit: my-api
  #   log_path: /var/log/my-api/app.log

  # Kubernetes 工作负载（示例，需本机有 kubectl 上下文）
  # - name: web-deploy
  #   connector: k8s
  #   namespace: default
  #   selector: app=web

infra:
  prometheus:
    url: ""            # 对方 Prometheus 地址，例如 http://metrics.customer.com:9090
