[project]
name = "ai-ops-controlplane"
version = "0.1.0"
description = "多租户智能运维平台 - 控制面 (FastAPI + SQLModel + Pydantic AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "pydantic-ai-slim[openai]>=0.0.20",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "cryptography>=42.0",
    "langfuse>=3.0",
    "langgraph>=0.2",
    "websockets>=13.0",
]

[tool.uv]
package = false
