name: health_check
description: 全面系统健康检查，快速掌握整体状态
triggers:
  - 健康检查
  - 系统状态
  - 全面检查
  - 整体情况
  - 整体健康
  - 整体
  - 都正常吗
  - 有没有问题
  - 巡检
  - 概览
  - overview
  - health

steps: |
  ## 排查剧本：全面健康检查（⚠️ 按需执行：先做前 2~3 步取证，证据足够支撑结论即收口作答；其余步骤仅在结论存疑时补充执行，避免为「完整性」过度取证）
  按顺序执行，不要跳步骤：
  1. list_services — 获取所有服务健康状态，建立全局视图
  2. query_prometheus('node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100') — 内存可用率
  3. query_prometheus('100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100') — CPU 使用率
  4. query_prometheus('up') — 确认所有 Prometheus 监控目标是否在线
  5. run_redis_command('INFO server') — 确认 Redis 正常，获取版本和运行时长
  6. 综合以上结果输出【健康报告】：
     - ✅ 正常的服务列表
     - ❌ 异常的服务及原因
     - ⚠️ 需要关注的风险点
     - 建议操作
