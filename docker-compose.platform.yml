services:
  platform-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: opspass
      POSTGRES_DB: controlplane
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d controlplane"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platform_pg_data:
