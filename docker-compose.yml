name: ai-ops-agent

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: opsdb
      MYSQL_USER: opsuser
      MYSQL_PASSWORD: opspass
      # 2026-09-22: 宿主(colima)内存小，显式限制 buffer_pool 防止 OOMKilled（ExitCode=137）
      command: --innodb_buffer_pool_size=128M --performance_schema=OFF
    mem_limit: 512m
    ports:
      - "3306:3306"
    volumes:
      - real_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - real_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:29092"
    environment:
      # Docker Desktop 默认只分配约 2GB 内存，Kafka 默认 1GB 堆会被 OOM Kill（exit 137）。
      # 演示环境用 256MB 堆即可稳定运行。
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INT:PLAINTEXT,PLAINTEXT_EXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT_INT://:9092,PLAINTEXT_EXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INT://kafka:9092,PLAINTEXT_EXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - real_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    command: ["--config.my-cnf=/.my.cnf", "--web.listen-address=:9104"]
    ports:
      - "9104:9104"
    volumes:
      - ./deploy/mysqld-exporter/my.cnf:/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - real_prometheus_data:/prometheus
    depends_on:
      node-exporter:
        condition: service_started
      kafka-exporter:
        condition: service_started
      mysqld-exporter:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      # ⚠️ 必须 ≥ 诊断提示的长度：我们的系统提示 + 工具 schema 约 8~10k tokens。
      # 曾设为 1024，Ollama 会把提示**静默截断**到 1k 以内 —— 模型根本看不到工具说明，
      # 于是 0 次工具调用、答非所问，但报告仍写 success（实测 prompt_eval 只有 514 tokens，
      # 显式 16384 后才变成 8194）。OpenAI 兼容接口**不透传** num_ctx，只能在这里设。
      OLLAMA_CONTEXT_LENGTH: "16384"
      # 30s 会让 embedding 模型（nomic-embed-text）闲置即卸载，每次诊断的首个检索
      # 要重付 ~4s 加载；实测 30m 后检索从 4.4s 降到 0.2~1.0s。
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # 并行度为 1：本地聊天模型忙碌时 embedding（RAG 检索）会排队甚至超时，
      # 表现为知识检索静默降级。要跑本地聊天模型建议把 embedding 指到独立服务。
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  real_mysql_data:
  real_redis_data:
  real_kafka_data:
  real_prometheus_data:
  ollama_data:
